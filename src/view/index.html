<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Fifa</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" type="text/css" href="../css/index.css" />
    </head>
    <body>
      <!-- 헤더 -->
        <header class="headerdiv">
            <button class="headerButton userInfo">내 전적 조회</button>
            <button class="headerButton transactionLookup">선수 조회</button>
            <button class="headerButton transactionLookup">강화 시뮬레이션</button>
            <button class="headerButton transactionLookup">카드 열기</button>
            <button class="headerButton transactionLookup">스쿼드</button>
        </header>

        <!-- 검색창 -->
        <div class="input-group mb-3" id="nickName-input">
            <div class="searchinfo">
                <input
                    type="text"
                    class="idinput form-control border-success"
                    placeholder="닉네임"
                    aria-label="Recipient's username"
                    aria-describedby="button-addon2"
                />
                <button class="btn" id="pw">❔</button>
            </div>
        </div>

        <!-- 닉네임을 찾지 못했을 경우 -->
        <div class="notFoundNickName"></div>
        
        <!-- 검색 클릭시 나타나는 모든 정보 -->
        <div class="allUserInfo hide">
            <div class="showUserRandomPhoto"></div>
            <button class="goodManners"></button>
            <button class="badManners"></button>
            <div class="showUserInfoTable"></div>
        </div>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script type="module" src="../js/index.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
